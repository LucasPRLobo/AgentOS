# Aider implements → approval gate → Tier 1 reviews
name: aider_code_review
version: "1.0"

budget:
  max_tokens: 100000
  max_cost_usd: 5.00

agents:
  implementer:
    adapter: tier2_aider
    model: gpt-4o
    role: "Implement the requested feature following best practices."
    tools: []
    budget:
      max_tokens: 40000

  reviewer:
    adapter: tier1
    model: claude-sonnet-4-6
    role: >
      You are a senior code reviewer. Analyze the implementation for
      correctness, security, performance, and code style. Provide specific,
      actionable feedback.
    tools: [file_read]
    budget:
      max_tokens: 20000

  fixer:
    adapter: tier2_aider
    model: gpt-4o
    role: "Apply code review feedback and fix identified issues."
    tools: []
    budget:
      max_tokens: 30000

tasks:
  implement:
    name: implement
    agent: implementer
    description: >
      Implement a Python utility module with: 1) a function to validate email
      addresses using regex, 2) a function to slugify strings (lowercase,
      hyphens, no special chars), 3) unit tests for both functions.
    workspace: shared

  review_gate:
    name: review_gate
    type: approval_gate
    depends_on: [implement]
    prompt: "Review the implementation before code review. Approve to continue."

  review:
    name: review
    agent: reviewer
    description: >
      Review the implementation from the 'implement' task. Check for:
      correctness, edge cases, security (ReDoS in regex), and code style.
      List specific issues and suggestions.
    depends_on: [review_gate]
    workspace: shared

  fix:
    name: fix
    agent: fixer
    description: >
      Apply the feedback from the code review. Fix all identified issues
      and ensure tests still pass.
    depends_on: [review]
    workspace: shared
