# Combined example: branching + revision loops + consultation
# Scenario: Feature development with testing, review, and deployment
name: collaborative_feature_dev
version: "1.0"

budget:
  max_tokens: 200000
  max_cost_usd: 8.00
  max_concurrent_tasks: 3

agents:
  developer:
    adapter: tier1
    model: claude-sonnet-4-6
    role: "Implement features and fix code based on review feedback."
    tools: [file_read, file_write, shell_exec]
    budget:
      max_tokens: 60000

  tester:
    adapter: tier1
    model: claude-sonnet-4-6
    role: "Write and run tests for the implementation."
    tools: [file_read, file_write, shell_exec]
    budget:
      max_tokens: 40000

  reviewer:
    adapter: tier1
    model: claude-sonnet-4-6
    role: "Review code for quality, security, and correctness."
    tools: [file_read]
    budget:
      max_tokens: 30000

  deployer:
    adapter: tier1
    model: claude-sonnet-4-6
    role: "Deploy the application to production."
    tools: [shell_exec, file_write]
    budget:
      max_tokens: 20000

tasks:
  # Step 1: Implement the feature (retryable on review rejection)
  implement:
    name: implement
    agent: developer
    description: "Implement the requested feature. If revision feedback is provided, address the specific issues."
    retry_policy:
      max_retries: 3
      on: gate_rejected

  # Step 2: Run tests
  run_tests:
    name: run_tests
    agent: tester
    description: "Write and run tests for the implementation."
    depends_on: [implement]
    conditions:
      - target: deploy
        expression: "'passed' in summary.lower() or 'success' in summary.lower()"
      - target: clarify_failures
        expression: "'fail' in summary.lower() or 'error' in summary.lower()"

  # Step 3a: If tests pass → code review gate
  code_review:
    name: code_review
    type: approval_gate
    depends_on: [implement]
    prompt: "Review the implementation. Approve or reject with specific feedback."

  # Step 3b: If tests fail → consult developer about failures
  clarify_failures:
    name: clarify_failures
    type: consultation
    depends_on: [run_tests]
    consult_agent: developer
    consult_question: "Tests are failing. What was your approach and what might be causing the failures?"

  # Step 4: Deploy (only if tests pass)
  deploy:
    name: deploy
    agent: deployer
    description: "Deploy the reviewed and tested feature to production."
    depends_on: [run_tests, code_review]
