# Revision loop: implement → review → ship (with retry on rejection)
name: code_review_loop
version: "1.0"

budget:
  max_tokens: 120000
  max_cost_usd: 5.00

agents:
  developer:
    adapter: tier1
    model: claude-sonnet-4-6
    role: "Implement features and fix code based on review feedback."
    tools: [file_read, file_write, shell_exec]
    budget:
      max_tokens: 40000

  shipper:
    adapter: tier1
    model: claude-sonnet-4-6
    role: "Prepare the release and deploy."
    tools: [shell_exec, file_write]
    budget:
      max_tokens: 20000

tasks:
  implement:
    name: implement
    agent: developer
    description: "Implement the feature. If revision feedback is provided, address it."
    retry_policy:
      max_retries: 3
      on: gate_rejected

  code_review:
    name: code_review
    type: approval_gate
    depends_on: [implement]
    prompt: "Review the implementation. Approve or reject with feedback."

  ship:
    name: ship
    agent: shipper
    description: "Prepare and deploy the release."
    depends_on: [code_review]
