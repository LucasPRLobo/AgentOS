# Collaborative Routing — Manager Agent Demo
#
# Demonstrates the ManagerAgent routing pattern where a central dispatcher
# routes incoming requests to specialized agents based on content analysis.
#
# Scenario: A software engineering team receives a batch of code review
# requests. A tech lead (manager agent) triages each review to the
# appropriate specialist, then a senior engineer synthesizes all findings.
#
# Features exercised:
#   - Manager agent (adapter: manager) with keyword-based routing
#   - Mixed adapter types (manager + tier2_claude_code)
#   - Fan-out from manager → specialists → fan-in to synthesis
#   - Approval gate for final sign-off
#
# DAG structure:
#
#   triage_security ──────────→ security_review ────────┐
#                                                       │
#   triage_performance ───────→ performance_review ─────┼─→ review_synthesis
#                                                       │        │
#   triage_architecture ──────→ architecture_review ────┘        ↓
#                                                         lead_sign_off_gate
#                                                                │
#                                                                ↓
#                                                         final_report

name: collaborative_routing
version: "1.5"

budget:
  max_tokens: 400000
  max_cost_usd: 6.00
  max_time_seconds: 1800
  max_concurrent_tasks: 3

agents:
  # ── Tech Lead (manager — routes reviews to specialists) ──────────

  tech_lead:
    adapter: manager
    role: >
      You are the Tech Lead responsible for triaging code review requests.
      Route each review to the most appropriate specialist based on the
      nature of the changes: security-sensitive code goes to the security
      reviewer, performance-critical paths go to the performance specialist,
      and structural/design changes go to the architecture reviewer.
    tools: []
    budget:
      max_tokens: 30000
      max_cost_usd: 0.50

  # ── Security Reviewer ────────────────────────────────────────────

  security_reviewer:
    adapter: tier2_claude_code
    role: >
      You are a senior security engineer conducting code reviews.
      Focus on: input validation, authentication/authorization flaws,
      injection vulnerabilities (SQL, XSS, command injection), secrets
      exposure, cryptographic misuse, and OWASP Top 10 issues.
      Rate each finding as Critical / High / Medium / Low severity.
    tools: [file_read, file_write, web_search]
    budget:
      max_tokens: 80000
      max_cost_usd: 1.50
      max_time_seconds: 600
    capabilities:
      - type: "tool:file_read"
      - type: "tool:file_write"
      - type: "path:reviews/**"

  # ── Performance Reviewer ─────────────────────────────────────────

  performance_reviewer:
    adapter: tier2_claude_code
    role: >
      You are a performance engineer conducting code reviews.
      Focus on: algorithmic complexity (Big-O), memory allocation patterns,
      database query efficiency (N+1 queries, missing indexes), caching
      opportunities, concurrency issues (lock contention, race conditions),
      and resource leaks. Suggest benchmarks for any concerning paths.
    tools: [file_read, file_write, shell_exec]
    budget:
      max_tokens: 80000
      max_cost_usd: 1.50
      max_time_seconds: 600

  # ── Architecture Reviewer ────────────────────────────────────────

  architecture_reviewer:
    adapter: tier2_claude_code
    role: >
      You are a software architect conducting code reviews.
      Focus on: separation of concerns, dependency management, API
      contract design, backward compatibility, modularity, testability,
      design pattern usage/misuse, and adherence to project conventions.
      Flag any changes that warrant an architecture decision record (ADR).
    tools: [file_read, file_write]
    budget:
      max_tokens: 80000
      max_cost_usd: 1.50
      max_time_seconds: 600

  # ── Senior Engineer (synthesizes all reviews) ─────────────────────

  senior_engineer:
    adapter: tier2_claude_code
    role: >
      You are the Senior Engineer responsible for producing the final
      consolidated code review report. Merge findings from all specialist
      reviews, resolve any conflicting recommendations, prioritize the
      action items, and produce a clear, actionable summary for the author.
    tools: [file_read, file_write]
    budget:
      max_tokens: 60000
      max_cost_usd: 1.00

tasks:
  # ════════════════════════════════════════════════════════════════════
  # PHASE 1: Manager triages reviews to specialists
  # ════════════════════════════════════════════════════════════════════

  triage_security:
    name: triage_security
    agent: tech_lead
    description: >
      Triage this code review request for security-sensitive changes:
      The PR modifies authentication middleware, adds a new OAuth2 provider
      integration, and updates the session token handling logic.
      Route to the appropriate security specialist for detailed review.
    workspace: reviews

  triage_performance:
    name: triage_performance
    agent: tech_lead
    description: >
      Triage this code review request for performance-critical changes:
      The PR refactors the database query layer, introduces connection
      pooling, and adds a caching layer for the most-accessed API endpoints.
      Route to the appropriate performance specialist for detailed review.
    workspace: reviews

  triage_architecture:
    name: triage_architecture
    agent: tech_lead
    description: >
      Triage this code review request for architectural changes:
      The PR introduces a new plugin system, refactors the service layer
      to use dependency injection, and adds a message broker abstraction
      for event-driven communication between modules.
      Route to the appropriate architecture specialist for detailed review.
    workspace: reviews

  # ════════════════════════════════════════════════════════════════════
  # PHASE 2: Specialist reviews (routed by manager)
  # ════════════════════════════════════════════════════════════════════

  security_review:
    name: security_review
    agent: security_reviewer
    description: >
      Conduct a thorough security review of the authentication and OAuth2
      changes. Examine: token storage mechanism, session fixation risks,
      CSRF protection, OAuth2 state parameter validation, redirect URI
      validation, and scope handling. Produce findings in security_review.md.
    depends_on: [triage_security]
    workspace: reviews

  performance_review:
    name: performance_review
    agent: performance_reviewer
    description: >
      Conduct a thorough performance review of the database and caching
      changes. Examine: connection pool sizing, cache invalidation strategy,
      query plan analysis for new queries, memory overhead of the cache
      layer, and concurrency behavior under load. Produce findings in
      performance_review.md.
    depends_on: [triage_performance]
    workspace: reviews

  architecture_review:
    name: architecture_review
    agent: architecture_reviewer
    description: >
      Conduct a thorough architecture review of the plugin system and DI
      changes. Examine: plugin lifecycle management, interface stability
      guarantees, circular dependency risks, message broker reliability
      semantics (at-least-once vs exactly-once), and migration path for
      existing modules. Produce findings in architecture_review.md.
    depends_on: [triage_architecture]
    workspace: reviews

  # ════════════════════════════════════════════════════════════════════
  # PHASE 3: Synthesis + Sign-off
  # ════════════════════════════════════════════════════════════════════

  review_synthesis:
    name: review_synthesis
    agent: senior_engineer
    description: >
      Synthesize all specialist review findings into a single consolidated
      code review report. For each finding:
      1. Categorize (security / performance / architecture)
      2. Assign priority (P0-blocker, P1-must-fix, P2-should-fix, P3-nice-to-have)
      3. Provide specific remediation guidance
      Identify any cross-cutting concerns (e.g., security implications of
      the caching layer, performance impact of the plugin system).
      Write the consolidated report to review_synthesis.md.
    depends_on: [security_review, performance_review, architecture_review]
    workspace: reviews

  lead_sign_off_gate:
    name: lead_sign_off_gate
    type: approval_gate
    depends_on: [review_synthesis]
    prompt: >
      Tech Lead Sign-off: Review the consolidated findings.
      Are all P0/P1 issues addressed? Is the report complete and actionable?
      Approve to generate the final report for the PR author.

  final_report:
    name: final_report
    agent: senior_engineer
    description: >
      Produce the FINAL code review report for the PR author.
      Structure:
      1. Executive Summary (approve / request changes / reject)
      2. Critical Findings (P0/P1 — must resolve before merge)
      3. Important Findings (P2 — should resolve in follow-up)
      4. Suggestions (P3 — optional improvements)
      5. Positive Highlights (what was done well)
      Write to final_review_report.md.
    depends_on: [lead_sign_off_gate]
    workspace: reviews
