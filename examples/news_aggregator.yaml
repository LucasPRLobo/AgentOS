# News Aggregator — quick-running demo workflow
#
# 9 tasks, 6 agents, 1 team with manager delegation, ~8-12 min live.
# Demonstrates: input gate, parallel research, fan-in, team with
# active manager supervision, approval gates, structured handoffs.
#
# Usage:
#   agentos workflow run examples/news_aggregator.yaml                       # stub
#   agentos workflow run examples/news_aggregator.yaml --live --interactive  # real

name: news_aggregator
version: "1.0"

budget:
  max_tokens: 500000
  max_cost_usd: 8.00
  max_time_seconds: 1800

agents:
  topic_curator:
    adapter: tier2_claude_code
    role: >
      Senior news curator. You scan the web for the most important recent
      developments on a given topic, identify key stories, and prioritize
      them by recency and significance.
    tools: [web_search, file_read, file_write]
    budget:
      max_time_seconds: 300

  web_researcher:
    adapter: tier2_claude_code
    role: >
      Investigative web researcher. You find primary sources, corroborating
      reports, expert quotes, and timelines for news stories.
    tools: [web_search, file_read, file_write]
    budget:
      max_time_seconds: 300

  social_analyst:
    adapter: tier2_claude_code
    role: >
      Social media and opinion analyst. You track public sentiment, trending
      discussions, editorials, and emerging narratives around news topics.
    tools: [web_search, file_read, file_write]
    budget:
      max_time_seconds: 300

  # ── Editorial team ────────────────────────────────────
  editor_in_chief:
    adapter: tier2_claude_code
    role: >
      Editor-in-chief of the newsroom. You manage the editorial team:
      delegate fact-checking to the fact_checker, review their work for
      thoroughness, then synthesize everything into a polished briefing.
    tools: [file_read, file_write]
    budget:
      max_time_seconds: 180

  fact_checker:
    adapter: tier2_claude_code
    role: >
      Rigorous fact-checker. You verify claims against primary sources, flag
      inconsistencies, and rate confidence levels for each claim.
    tools: [web_search, file_read, file_write]
    budget:
      max_time_seconds: 300

  copywriter:
    adapter: tier2_claude_code
    role: >
      News copywriter. You turn raw research and fact-check reports into
      clear, engaging prose suitable for a professional news briefing.
    tools: [file_read, file_write]
    budget:
      max_time_seconds: 120

teams:
  editorial_team:
    manager: editor_in_chief
    members: [fact_checker, copywriter]
    description: >
      Editorial team responsible for verifying research accuracy and
      producing the final polished news briefing. The editor delegates
      fact-checking and copywriting, reviews quality, and consolidates.

tasks:
  # ── Human provides the topic ──────────────────────────
  topic_selection:
    name: topic_selection
    type: input_gate
    prompt: |
      What topic should the news briefing cover?
      Examples: "AI regulation in the EU", "SpaceX Starship updates",
      "US inflation data", "OpenAI latest developments"

  # ── Curator scans for key stories ─────────────────────
  source_scan:
    name: source_scan
    type: agent_task
    agent: topic_curator
    depends_on: [topic_selection]
    workspace: shared
    description: |
      Based on the topic provided, scan the web for the most important
      recent developments (last 7 days).

      Produce a structured source list:
      - 5-8 key stories ranked by significance
      - Source URL and publication for each
      - One-sentence description of each story
      - Tag each as BREAKING, DEVELOPING, or BACKGROUND

  # ── Parallel deep-dive research ───────────────────────
  web_deep_dive:
    name: web_deep_dive
    type: agent_task
    agent: web_researcher
    depends_on: [source_scan]
    workspace: shared
    description: |
      Take the stories identified by the curator and do a deep dive.
      For each key story find:
      - The original primary source
      - At least 2 corroborating sources
      - Key quotes from officials or experts
      - Timeline of events

      Write a detailed research report (research_report.md).

  sentiment_analysis:
    name: sentiment_analysis
    type: agent_task
    agent: social_analyst
    depends_on: [source_scan]
    workspace: shared
    description: |
      Analyze public reaction and sentiment around the topic.
      Search for:
      - What people are saying on social media and forums
      - Key opinion pieces and editorials
      - Emerging narratives or controversies
      - Overall sentiment direction (positive / negative / mixed)

      Write a sentiment report (sentiment_report.md).

  # ── Research review gate ──────────────────────────────
  research_review:
    name: research_review
    type: approval_gate
    depends_on: [web_deep_dive, sentiment_analysis]
    prompt: >
      Parallel research streams complete (web deep-dive + sentiment).
      Review the raw research before editorial processing.

  # ── Manager-led editorial: fact-check + write ─────────
  editorial_production:
    name: editorial_production
    type: agent_task
    agent: editor_in_chief
    depends_on: [research_review]
    workspace: shared
    description: |
      You have research and sentiment reports from the research phase.
      As editor-in-chief, manage your team to produce the final briefing:

      1. Assign the fact_checker to verify all claims and statistics
         from the research. They should rate each claim as
         VERIFIED / LIKELY ACCURATE / UNVERIFIED / DISPUTED.
      2. Assign the copywriter to draft the news briefing using this
         structure:
         - HEADLINE — One compelling sentence
         - TL;DR — 2-3 sentence summary
         - KEY DEVELOPMENTS — Bullet points of key facts
         - CONTEXT — Background and why this matters
         - PUBLIC REACTION — Sentiment summary
         - WHAT TO WATCH — Upcoming developments
         - SOURCES — Primary sources used
      3. Review both outputs. If the fact-checker found disputed claims,
         ensure the copywriter marks them with [UNVERIFIED] tags.
      4. Consolidate into the final news_briefing.md.

  # ── Final sign-off ────────────────────────────────────
  final_approval:
    name: final_approval
    type: approval_gate
    depends_on: [editorial_production]
    prompt: >
      Review the final news briefing produced by the editorial team.
      Approve to publish or reject with feedback.

channels:
  news_feed:
    name: news_feed
    mode: broadcast
