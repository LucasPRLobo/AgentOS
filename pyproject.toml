[project]
name = "agentos"
version = "1.0.0-dev"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "mypy"]
aider = ["aider-chat"]
dashboard = ["fastapi>=0.100", "uvicorn[standard]>=0.20", "websockets>=12.0"]
intelligence = []
marketplace = []
all = ["agentos[dashboard]", "agentos[intelligence]", "agentos[marketplace]", "agentos[aider]"]

[project.scripts]
agentos = "agentos.cli.main:cli"

[tool.setuptools.packages.find]
include = ["agentos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration", "e2e", "slow"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
